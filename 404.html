    <script>
    (function () {
        var btn = document.getElementById('mode-toggle');
        if (!btn) return;

        // Cycle: paper → dark → fluoro → paper
        // Button label always shows the NEXT mode

        function currentMode() {
            var html = document.documentElement;
            if (html.classList.contains('fluoro')) return 'fluoro';
            if (html.classList.contains('dark'))   return 'dark';
            return 'paper';
        }

        function applyMode(mode) {
            var html = document.documentElement;
            html.classList.remove('fluoro', 'dark');
            if (mode === 'fluoro') html.classList.add('fluoro');
            if (mode === 'dark')   html.classList.add('dark');
            localStorage.setItem('rave-mode', mode);
        }

        function nextMode(mode) {
            if (mode === 'paper')  return 'dark';
            if (mode === 'dark')   return 'fluoro';
            return 'paper';
        }

        function updateLabel() {
            var next = nextMode(currentMode());
            btn.textContent = next.toUpperCase();
            btn.title = 'Switch to ' + next + ' mode';
            btn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
        }

        updateLabel();

        btn.addEventListener('click', function () {
            applyMode(nextMode(currentMode()));
            updateLabel();
        });
    })();
    </script>
