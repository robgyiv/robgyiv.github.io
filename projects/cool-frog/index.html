    <script>(function(){
      var hues = [{n:'yellow',h:105},{n:'orange',h:45},{n:'pink',h:355},{n:'purple',h:295},{n:'green',h:145},{n:'cyan',h:210}];
      var html = document.documentElement;
      var lastHue = parseFloat(localStorage.getItem('rave-hue'));
      var override = localStorage.getItem('rave-hue-override');
      var hue, source;
      if (override !== null) { hue = parseFloat(override); source = 'you'; }
      else {
        var pool = hues.filter(function(x){ return x.h !== lastHue; });
        var pick = pool[Math.floor(Math.random()*pool.length)];
        hue = pick.h; source = 'random';
      }
      html.style.setProperty('--h', hue);
      html.setAttribute('data-hue-source', source);
      localStorage.setItem('rave-hue', hue);
      var theme = localStorage.getItem('rave-theme');
      if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'fluoro';
      html.classList.add(theme);
    })();</script>
